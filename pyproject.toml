[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "at3_crypto"
version = "0.0.1"
description = "Experimentation repo for the 36120 AT3 Cryptocurrency Financial Intelligence Platform"
authors = [
  { name = "Group 12" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["at3_crypto"]
include = ["pyproject.toml", "at3_crypto/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["at3_crypto"]
force-sort-within-sections = true

